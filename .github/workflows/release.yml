name: Build and release RePlay Mod

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-26-1:
    name: Minecraft 26.1.2
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6

      - name: Check out upstream submodules
        shell: bash
        run: |
          git submodule set-url jGui https://github.com/ReplayMod/jGui.git
          git submodule set-url libs/ReplayStudio https://github.com/ReplayMod/ReplayStudio.git
          git submodule set-url src/main/resources/assets/replaymod/lang https://github.com/ReplayMod/Translations.git
          git submodule update --init --recursive --depth 1

      - name: Install JDK 8 for legacy preprocessing
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      - name: Install JDK 16 for Minecraft 1.17 preprocessing
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "16"

      - name: Set up JDK 21 as the build JVM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Apply RePlay branding to bundled translations
        shell: bash
        run: |
          sed -i 's/^replaymod.title=Replay Mod$/replaymod.title=Re:Play Mod/' src/main/resources/assets/replaymod/lang/en_US.lang
          sed -i 's/^replaymod.gui.settings.title=Replay Mod Settings$/replaymod.gui.settings.title=Re:Play Mod Settings/' src/main/resources/assets/replaymod/lang/en_US.lang
          sed -i 's/^replaymod.input.settings=ReplayMod Settings$/replaymod.input.settings=Re:Play Mod Settings/' src/main/resources/assets/replaymod/lang/en_US.lang
          sed -i 's/^replaymod.title=Replay Mod$/replaymod.title=Re:Play Mod/' src/main/resources/assets/replaymod/lang/ja_JP.lang
          sed -i 's/^replaymod.gui.settings.title=Replay Modの設定$/replaymod.gui.settings.title=Re:Play Modの設定/' src/main/resources/assets/replaymod/lang/ja_JP.lang
          sed -i 's/^replaymod.input.settings=ReplayModの設定$/replaymod.input.settings=Re:Play Modの設定/' src/main/resources/assets/replaymod/lang/ja_JP.lang

      - name: Build Minecraft 26.1 target
        run: ./gradlew :26.1:bundleJar --no-daemon --stacktrace

      - name: Collect distributable
        shell: bash
        run: |
          mkdir -p release
          find versions/26.1/build/libs -maxdepth 1 -type f -name 're-play-mod-*.jar' ! -name '*-sources.jar' ! -name '*-raw.jar' -exec cp {} release/ \;
          test "$(find release -maxdepth 1 -name '*.jar' | wc -l)" -ge 1
          sha256sum release/*.jar > release/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: RePlay-Mod-Minecraft-26.1.2
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Re:Play Mod ${{ github.ref_name }} for Minecraft 26.1.2"
          body_path: RELEASE_NOTES.md
          files: release/*
          generate_release_notes: true
